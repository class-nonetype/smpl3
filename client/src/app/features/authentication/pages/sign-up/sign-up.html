<form class="card" [formRoot]="signUpForm">
  <h1>Crea tu cuenta</h1>

  <mat-form-field>
    <mat-label>Nombre de usuario</mat-label>
    <input matInput autocomplete="username" [formField]="signUpForm.username" />
    @if (signUpForm.username().errors()[0]; as error) {
      <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  <mat-form-field>
    <mat-label>Correo</mat-label>
    <input matInput type="email" autocomplete="email" [formField]="signUpForm.email" />
    @if (signUpForm.email().errors()[0]; as error) {
      <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  <password-field [field]="signUpForm.password" autocomplete="new-password" hint="Entre 8 y 72 caracteres" />

  @if (signUpForm().errors()[0]; as error) {
    <p class="form-error" role="alert">{{ error.message }}</p>
  }

  <button matButton="filled" type="submit" [disabled]="signUpForm().submitting()">
    {{ signUpForm().submitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
  </button>

  <a matButton routerLink="../sign-in">¿Ya tienes cuenta? Inicia sesión</a>
</form>
