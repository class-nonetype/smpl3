<form class="card" [formRoot]="signInForm">
  <h1>Iniciar sesión</h1>

  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="email" autocomplete="email" [formField]="signInForm.email" />
    @if (signInForm.email().errors()[0]; as error) {
      <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  <mat-form-field>
    <mat-label>Contraseña</mat-label>
    <input
      matInput
      autocomplete="current-password"
      [type]="hidePassword() ? 'password' : 'text'"
      [formField]="signInForm.password"
    />
    <button
      matIconButton
      matSuffix
      type="button"
      [attr.aria-label]="hidePassword() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
      (click)="hidePassword.update((hidden) => !hidden)"
    >
      <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
    </button>
    @if (signInForm.password().errors()[0]; as error) {
      <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  @if (signInForm().errors()[0]; as error) {
    <p class="form-error" role="alert">{{ error.message }}</p>
  }

  <button matButton="filled" type="submit" [disabled]="signInForm().submitting()">
    {{ signInForm().submitting() ? 'Entrando…' : 'Entrar' }}
  </button>

  <a matButton routerLink="../sign-up">¿No tienes cuenta? Regístrate</a>
</form>
