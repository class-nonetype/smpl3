<form class="card" [formRoot]="signInForm">
  <h1>Iniciar sesión</h1>

  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="email" autocomplete="email" [formField]="signInForm.email" />
    @if (signInForm.email().errors()[0]; as error) {
      <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  <password-field [field]="signInForm.password" autocomplete="current-password" />

  @if (signInForm().errors()[0]; as error) {
    <p class="form-error" role="alert">{{ error.message }}</p>
  }

  <button matButton="filled" type="submit" [disabled]="signInForm().submitting()">
    {{ signInForm().submitting() ? 'Entrando…' : 'Entrar' }}
  </button>

  <a matButton routerLink="../sign-up">¿No tienes cuenta? Regístrate</a>
</form>
