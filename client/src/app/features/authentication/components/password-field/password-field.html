@let state = field()();

<mat-form-field>
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [autocomplete]="autocomplete()"
    [type]="hidden() ? 'password' : 'text'"
    [formField]="field()"
  />
  <button
    matIconButton
    matSuffix
    type="button"
    [attr.aria-label]="hidden() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
    (click)="hidden.update((value) => !value)"
  >
    <mat-icon>{{ hidden() ? 'visibility' : 'visibility_off' }}</mat-icon>
  </button>
  @if (hint(); as hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }
  @if (state.errors()[0]; as error) {
    <mat-error>{{ error.message }}</mat-error>
  }
</mat-form-field>
